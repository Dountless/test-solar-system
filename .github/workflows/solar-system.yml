name: Solar System Workflow

on:
    workflow_dispatch: 
    push:
        branches:
            - main
            - 'feature/*'

env:
  MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
  MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

jobs:
    unit-testing:
        name: Unit Testing
        strategy:
          matrix:
              node-version: [19]
              os: [ubuntu-latest]
              exclude:
                - node-version: 18
                  os: windows-latest

        runs-on: ${{ matrix.os }}
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v6

        - name: Setup NodeJS Version -${{ matrix.node-version }}
          uses: actions/setup-node@v6
          with:
            node-version: ${{ matrix.node-version }}



        - name: Cache node modules
          uses: actions/cache@v4
          with:
            path: node_modules
            key: ${{ runner.os }}-node_modules-${{ hashFiles('package-lock.json') }}

        - name: Install Depedencies
          run: npm install

        - name: Unit Testing
          id: unit-test
          run: npm test

        - uses: actions/upload-artifact@v6
          name: Upload Artifacts
          if: always()
          with:
            name: Mocha-Test-Artifacts-${{ matrix.os }}-node-${{ matrix.node-version }}
            path: test-results.xml

    code-coverage:
        name: Code Coverage
        runs-on: ubuntu-latest
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v6

        - name: Setup NodeJS Version - 18
          uses: actions/setup-node@v6
          with:
            node-version: 18

        - name: Cache node modules
          uses: actions/cache@v4
          with:
            path: node_modules
            key: ${{ runner.os }}-node_modules-${{ hashFiles('package-lock.json') }}

        - name: Install Depedencies
          run: npm install

        - name: Code Coverage
          continue-on-error: true
          run: npm run coverage

        - uses: actions/upload-artifact@v6
          name: Upload Artifacts
          with:
            name: Code-Coverage
            path: coverage
            retention-days: 5

    docker:
       name: containerization
       needs: [unit-testing, code-coverage]
       runs-on: ubuntu-latest

       steps:
        - name: Checkout The code
          uses: actions/checkout@v6

        - name: Login to Docker Hub
          uses: docker/login-action@v4
          with:
            username: ${{ vars.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

        - name: Login to GHCR (GitHub Conatiner Registry)
          uses: docker/login-action@v4
          with:
            registry: ghcr.io
            username: ${{ github.repository_owner }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Build Docker image
          uses: docker/build-push-action@v6
          with:
            context: .
            push: false
            tags: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}

        - name: Test Docker Image
          run: |
            docker images
            docker container run --name solar-system-app -d  \
                -p 3000:3000 \
                -e MONGO_URI=$MONGO_URI \
                -e MONGO_USERNAME=$MONGO_USERNAME \
                -e MONGO_PASSWORD=$MONGO_PASSWORD \
                ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}
            
            export IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' solar-system-app)
            echo $IP

            echo Testing Image URL using wget
            wget -q -O - 127.0.0.1:3000/live | grep live

        - id: string
          uses: ASzc/change-string-case-action@v1
          with:
            string: ${{ github.repository }}
            
        - run: |
            echo "${{ steps.string.outputs.lowercase }}"

        - name: Docker Push      
          uses: docker/build-push-action@v6
          with:
            push: true
            tags: |
              ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}
              ghcr.io/${{ github.repository_owner }}/solar-ystem:${{ github.sha }}




