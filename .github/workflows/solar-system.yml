name: Solar System Workflow

on:
    workflow_dispatch: 
    push:
        branches:
            - main
            - 'feature/*'

env:
  
  MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

jobs:
    unit-testing:
        name: Unit Testing   
        # Service containers to run with `runner-job`
        services:
          # Label used to access the service container
          mongo-db:
            # Docker Hub image
            image: siddharth67/mongo-db:non-prod
            #
            ports:
              # Opens tcp port 27017 on the host and service container
              - 27017:27017

        env:
          MONGO_URI: 'mongodb://localhost:27017/superData'
          MONGO_USERNAME: non-prod-user
          MONGO_PASSWORD: non-prod-password

        strategy:
          matrix:
              node-version: [19]
              os: [ubuntu-latest]
              exclude:
                - node-version: 18
                  os: windows-latest

        runs-on: ${{ matrix.os }}
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v6

        - name: Setup NodeJS Version -${{ matrix.node-version }}
          uses: actions/setup-node@v6
          with:
            node-version: ${{ matrix.node-version }}



        - name: Cache node modules
          uses: actions/cache@v4
          with:
            path: node_modules
            key: ${{ runner.os }}-node_modules-${{ hashFiles('package-lock.json') }}

        - name: Install Depedencies
          run: npm install

        - name: Unit Testing
          id: unit-test
          run: npm test

        - uses: actions/upload-artifact@v6
          name: Upload Artifacts
          if: always()
          with:
            name: Mocha-Test-Artifacts-${{ matrix.os }}-node-${{ matrix.node-version }}
            path: test-results.xml

    code-coverage:
        name: Code Coverage
        container: 
          image: node:18

        services:
          # Label used to access the service container
          mongo-db:
            # Docker Hub image
            image: siddharth67/mongo-db:non-prod
            options: 
              --name mongodb
        env:
          MONGO_URI: 'mongodb://mongodb:27017/superData'
          MONGO_USERNAME: non-prod-user
          MONGO_PASSWORD: non-prod-password

        runs-on: ubuntu-latest
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v6

        # - name: Setup NodeJS Version - 18
        #   uses: actions/setup-node@v6
        #   with:
        #     node-version: 18

        - name: Cache node modules
          uses: actions/cache@v4
          with:
            path: node_modules
            key: ${{ runner.os }}-node_modules-${{ hashFiles('package-lock.json') }}

        - name: Install Depedencies
          run: npm install

        - name: Code Coverage
          continue-on-error: true
          run: npm run coverage

        - uses: actions/upload-artifact@v6
          name: Upload Artifacts
          with:
            name: Code-Coverage
            path: coverage
            retention-days: 5
    report-to-s3:
      name: Send reports to s3
      needs: [code-coverage, unit-testing]
      runs-on: ubuntu-latest
      steps:
        - name: Download Unit test file
          uses: actions/download-artifact@v6
          with:  
           name: Mocha-Test-Artifacts-${{ matrix.os }}-node-${{ matrix.node-version }}

        - name: Download code coverage test file
          uses: actions/download-artifact@v6
          with:  
           name: Code-Coverage

        - name: Merge files
          run: |
           ls -ltr
           mkdir 
           mv cobertura-coverage.xml reports-${{ github.sha }}
           mv test-results.xml reports-${{ github.sha }}
           ls -ltr reports-${{ github.sha }}

        - name: Upload to AWS S3
          run: echo "Uploading done"
          # uses: jakejarvis/s3-sync-action@master
          # with:
          #   args: --acl public-read --follow-symlinks --delete
          # env:
          #   AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          #   AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          #   AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          #   AWS_REGION: 'us-west-1'   # optional: defaults to us-east-1
          #   SOURCE_DIR: reports-${{ github.sha }}    
          #   DEST_DIR:  reports-${{ github.sha }}   # optional: defaults to entire repository


    docker:
       name: containerization
       needs: [unit-testing, code-coverage]
       permissions: 
         packages: write
       runs-on: ubuntu-latest

       steps:
        - name: Checkout The code
          uses: actions/checkout@v6

        - name: Login to Docker Hub
          uses: docker/login-action@v4
          with:
            username: ${{ vars.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

        - name: Login to GHCR (GitHub Conatiner Registry)
          uses: docker/login-action@v4
          with:
            registry: ghcr.io
            username: ${{ github.repository_owner }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Build Docker image
          uses: docker/build-push-action@v6
          with:
            context: .
            push: false
            tags: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}

        - name: Test Docker Image
          run: |
            docker images
            docker container run --name solar-system-app -d  \
                -p 3000:3000 \
                -e MONGO_URI=$MONGO_URI \
                -e MONGO_USERNAME=$MONGO_USERNAME \
                -e MONGO_PASSWORD=$MONGO_PASSWORD \
                ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}
            
            export IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' solar-system-app)
            echo $IP

            echo Testing Image URL using wget
            wget -q -O - 127.0.0.1:3000/live | grep live

        - id: string
          name: Convert Account name to lowercase
          uses: ASzc/change-string-case-action@v1
          with:
            string: ${{ github.repository_owner }}
            
        - run: |
            echo "${{ steps.string.outputs.lowercase }}"

        - name: Docker Push      
          uses: docker/build-push-action@v6
          with:
            push: true
            tags: |
              ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}
              ghcr.io/${{ steps.string.outputs.lowercase }}/solar-ystem:${{ github.sha }}

    dev-deploy:
      needs: docker
      uses: ./.github/workflows/reusable-workflow.yml
      secrets:
        mongodb-secret: ${{ secrets.MONGO_PASSWORD }}
      with:
       mongo-uri: ${{ vars.MONGO_URI }} 
       kubectl-version: 'v1.26.0'
       deployment-path: 'kubernetes/development/'
       K8S_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}

    Integration-testing:
      name: Dev Intgration Testing
      needs: [dev-deploy]
      runs-on: ubuntu-latest
      steps:
        - name: Test URL output using curl and JQ
          env:
            URL: ${{ needs.dev-deploy.outputs.app-url }}
          run: |
           echo $URL
           echo "--------------------------"
           curl http://$URL/live -s | jq -r .status | grep -i live


           
           


            


